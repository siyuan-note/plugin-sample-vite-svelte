version: 2

updates:
  # npm dependencies, grouped into one pull request per month.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "📦 chore(deps)"
    assignees:
      - "frostime"
    groups:
      npm:
        patterns:
          - "*"

  # Keep the workflow actions current; deprecated Node runtimes eventually break.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "👷 ci(deps)"
    assignees:
      - "frostime"
    groups:
      actions:
        patterns:
          - "*"
