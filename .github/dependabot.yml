version: 2

updates:
  # Version updates run monthly; security updates are triggered by alerts.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    # Both update types must preserve the ranges declared in package.json.
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "📦 chore(deps)"
    groups:
      npm:
        applies-to: "version-updates"
        patterns:
          - "*"
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Update actions within their reviewed major versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "👷 ci(deps)"
    # Explicit version bounds also constrain security PRs; update-types does not.
    # Review these bounds when adding an action or upgrading its major version.
    ignore:
      - dependency-name: "actions/checkout"
        versions: [">=8"]
      - dependency-name: "actions/setup-node"
        versions: [">=8"]
      - dependency-name: "pnpm/action-setup"
        versions: [">=7"]
      - dependency-name: "ncipollo/release-action"
        versions: [">=2"]
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
