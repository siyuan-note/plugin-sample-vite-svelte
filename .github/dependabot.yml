version: 2

updates:
  # npm dependencies, grouped into one pull request per month.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "📦 chore(deps)"
    assignees:
      - "frostime"
    ignore:
      # `svelte-check` 4.x refuses to run on TypeScript 7 alone: it needs a
      # second TypeScript 6 install plus the `--tsgo` flag. Drop this rule
      # when `svelte-check` supports TypeScript 7 directly.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm:
        patterns:
          - "*"

  # Keep the workflow actions current; deprecated Node runtimes eventually break.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "👷 ci(deps)"
    assignees:
      - "frostime"
    groups:
      actions:
        patterns:
          - "*"
